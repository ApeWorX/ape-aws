[build-system]
requires = ["setuptools>=75.6.0", "setuptools_scm[toml]>=5.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ape-aws"
description = "Ape AWS KMS: Ape plugin to make transactions through AWS KMS"
readme = "README.md"
license = {text = "Apache-2.0"}
keywords = ["ethereum", "ape", "aws", "kms", "signing"]
authors = [
    {name = "ApeWorX Ltd.", email = "admin@apeworx.io"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34.79,<2",
    "eth-ape>=0.8.2,<0.9",
    "ecdsa>=0.19.0,<1",
    "cryptography>=37.0.4,<38",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/ApeWorX/ape-aws"
Documentation = "https://github.com/ApeWorX/ape-aws/blob/main/README.md"
Source = "https://github.com/ApeWorX/ape-aws"
Tracker = "https://github.com/ApeWorX/ape-aws/issues"

[project.entry-points."ape_cli_subcommands"]
ape_aws = "ape_aws._cli:cli"

[dependency-groups]
test = [
    "pytest>=8.0,<9.0",
    "pytest-xdist",
    "pytest-cov",
    "pytest-mock",
    "hypothesis>=6.2.0,<7.0",
]
lint = [
    "mypy>=1.8.0,<2",
    "ruff>=0.8.0,<1",
    "mdformat>=0.7.18",
    "mdformat-gfm>=0.3.5",
    "mdformat-frontmatter>=0.4.1",
    "mdformat-pyproject>=0.0.1",
]
release = [
    "setuptools>=75.6.0",
    "wheel",
    "twine",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "release"},
    "commitizen>=2.40,<2.41",
    "prek",
    "pytest-watch",
    "IPython",
    "ipdb",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.setuptools.package-data]
ape_aws = ["py.typed"]

[tool.setuptools_scm]
write_to = "ape_aws/version.py"

[tool.mypy]
exclude = "build/"
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "T20",  # flake8-print
    "PYI",  # flake8-pyi
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TC",   # flake8-type-checking
    "ARG",  # flake8-unused-arguments
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
"version.py" = ["T201"]
"exceptions.py" = ["N818"]
"tests/*" = ["T201", "ARG"]

[tool.ruff.lint.isort]
force-single-line = false
known-first-party = ["ape_aws"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = """
    -p no:ape_test
    --cov-branch
    --cov-report term
    --cov-report html
    --cov-report xml
    --cov=ape_aws
"""
python_files = "test_*.py"
testpaths = "tests"
markers = "fuzzing: Run Hypothesis fuzz test suite"

[tool.mdformat]
wrap = 100
number = false
